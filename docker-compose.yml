# docker-compose.yml
# Uso opcional: para cuando tengas una VPS propia (Oracle, Contabo, etc.)
#   docker compose up -d
#   docker compose logs -f
#
# En GitHub Actions NO se usa este archivo.

services:
  minecraft:
    image: itzg/minecraft-server:java21
    container_name: minecraft
    tty: true
    stdin_open: true
    ports:
      - "25565:25565/tcp"
      - "19132:19132/udp"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.21.11"
      MEMORY: "6G"
      ONLINE_MODE: "TRUE"
      MOTD: "Ragsnor | Java + Bedrock"
      MAX_PLAYERS: "20"
      VIEW_DISTANCE: "8"
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
      # Ajusta Geyser a floodgate tras el primer arranque:
      #   docker exec minecraft sed -i 's/auth-type: online/auth-type: floodgate/' \
      #     /data/plugins/Geyser-Spigot/config.yml && docker restart minecraft
    volumes:
      - ./data:/data
    restart: unless-stopped

  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: playit
    network_mode: host
    environment:
      SECRET_KEY: "${PLAYIT_SECRET}"
    restart: unless-stopped
