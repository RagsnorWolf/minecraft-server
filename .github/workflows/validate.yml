name: Validate Paper server setup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq screen jq
      - name: Validate shell and JSON
        run: |
          bash -n .devcontainer/setup.sh .devcontainer/start.sh scripts/*.sh
          python3 -m json.tool .devcontainer/devcontainer.json >/dev/null
          python3 -m py_compile scripts/configure-geyser.py
      - name: Test automatic Floodgate configuration
        run: |
          mkdir -p server/plugins/Geyser-Spigot
          cat > server/plugins/Geyser-Spigot/config.yml <<'YAML'
          remote:
            address: auto
            port: 25565
            auth-type: online
          bedrock:
            port: 19132
          YAML
          set +e
          python3 scripts/configure-geyser.py
          result=$?
          set -e
          test "$result" -eq 3
          grep -q 'auth-type: floodgate' server/plugins/Geyser-Spigot/config.yml
      - name: Install Paper 1.21.10 and plugins
        run: bash scripts/install.sh
      - name: Boot Paper briefly
        env:
          HEAP: 2G
          XMS: 1G
          SKIP_PLAYIT: "true"
        run: |
          bash scripts/start.sh
          grep -qE 'Done \([0-9.]+s\)!' server/logs/latest.log
          grep -qi 'Geyser' server/logs/latest.log
      - name: Stop Paper and save test logs
        if: always()
        run: |
          bash scripts/stop.sh || true
      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-1.21.10-smoke-test
          path: |
            server/logs/latest.log
            server/logs/console.log
          if-no-files-found: ignore
          retention-days: 7
