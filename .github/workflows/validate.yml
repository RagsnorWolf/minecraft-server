name: Validate Minecraft Server Configuration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate scripts and configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install YAML parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml

      - name: Check Playit secret presence (values stay private)
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
          PLAYIT_GEYSER_CONFIG: ${{ secrets.PLAYIT_GEYSER_CONFIG }}
          PLAYIT_BEDROCK_ADDRESS: ${{ secrets.PLAYIT_BEDROCK_ADDRESS }}
        run: |
          for name in PLAYIT_SECRET PLAYIT_GEYSER_CONFIG PLAYIT_BEDROCK_ADDRESS; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name: present"
            else
              echo "$name: missing"
            fi
          done

      - name: Check shell syntax
        run: |
          set -euo pipefail
          for file in scripts/install.sh scripts/run.sh .devcontainer/setup.sh .devcontainer/start.sh; do
            echo "Checking $file"
            bash -n "$file"
          done

      - name: Check Python syntax
        run: python3 -m py_compile scripts/configure-geyser.py

      - name: Validate workflow and devcontainer formats
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml

          json.loads(Path(".devcontainer/devcontainer.json").read_text())
          for file in [".github/workflows/minecraft.yml", ".github/workflows/validate.yml"]:
              yaml.safe_load(Path(file).read_text())
          print("JSON and YAML formats are valid.")
          PY

      - name: Test runtime Geyser configuration
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          import yaml

          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              config_dir = root / "plugins" / "Geyser-Spigot"
              config_dir.mkdir(parents=True)
              config_file = config_dir / "config.yml"
              config_file.write_text(
                  "bedrock:\n"
                  "  address: 0.0.0.0\n"
                  "  port: 19132\n"
                  "  transport: raknet\n"
                  "remote:\n"
                  "  address: auto\n"
                  "  port: 25565\n"
                  "  auth-type: online\n",
                  encoding="utf-8",
              )

              env = os.environ.copy()
              env["PLAYIT_GEYSER_CONFIG"] = (
                  "bedrock:\n"
                  "  transport: nethernet\n"
                  "  signaling:\n"
                  "    test-setting: enabled\n"
              )
              env["PLAYIT_BEDROCK_ADDRESS"] = "ragsnor-test.tun.ply.gg"

              subprocess.run(
                  ["python3", "scripts/configure-geyser.py", str(root)],
                  check=True,
                  env=env,
              )

              config = yaml.safe_load(config_file.read_text(encoding="utf-8"))
              assert config["bedrock"]["transport"] == "nethernet"
              assert config["bedrock"]["signaling"]["test-setting"] == "enabled"
              assert config["remote"]["auth-type"] == "floodgate"
              address_file = root / "GEYSER_BEDROCK_ADDRESS.txt"
              assert address_file.read_text(encoding="utf-8").strip() == "ragsnor-test.tun.ply.gg:19132"

          print("Geyser/Floodgate/Playit configuration test passed.")
          PY

  server-smoke:
    name: Boot Paper and plugins in an isolated runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install server utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq screen jq curl python3-yaml

      - name: Install Paper and plugins
        run: PAPER_VERSION=1.21.10 bash scripts/install.sh

      - name: Start server briefly without public tunnels
        run: SKIP_PUBLIC_TUNNELS=true DURATION=2 HEAP=4G bash scripts/run.sh

      - name: Verify server and plugins
        run: |
          grep -q 'Done (' server/logs/latest.log
          test -s server/plugins/Geyser-Spigot.jar
          test -s server/plugins/floodgate-spigot.jar
          test -s server/plugins/ViaVersion.jar
          grep -E 'Geyser|floodgate|ViaVersion' server/logs/latest.log | tail -n 20

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-smoke-test-logs
          path: |
            server/logs/latest.log
            server/logs/*.log.gz
          if-no-files-found: ignore
          retention-days: 7
