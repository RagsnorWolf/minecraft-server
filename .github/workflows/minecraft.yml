name: Minecraft Server

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Paper version (por defecto 1.21.10 para conservar el mundo actual)"
        required: false
        default: "1.21.10"
      duration:
        description: "Minutos online (máximo 350)"
        required: false
        default: "330"
      heap:
        description: "RAM de Java (ej: 4G, 6G)"
        required: false
        default: "6G"

concurrency:
  group: minecraft-server
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  server:
    name: Paper + Geyser + Floodgate + ViaVersion
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PAPER_VERSION: ${{ inputs.version }}
      DURATION: ${{ inputs.duration }}
      HEAP: ${{ inputs.heap }}
      PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
      PLAYIT_GEYSER_CONFIG: ${{ secrets.PLAYIT_GEYSER_CONFIG }}
      PLAYIT_BEDROCK_ADDRESS: ${{ secrets.PLAYIT_BEDROCK_ADDRESS }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install YAML support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml
      - name: Restore world and configuration
        uses: actions/cache/restore@v4
        with:
          path: |
            server/world
            server/world_nether
            server/world_the_end
            server/plugins/Geyser-Spigot
            server/plugins/floodgate
            server/plugins/*/
            server/server.properties
            server/config/
            server/bukkit.yml
            server/spigot.yml
            server/paper.yml
            server/commands.yml
            server/ops.json
            server/whitelist.json
            server/banned-ips.json
            server/banned-players.json
          key: mcworld-${{ github.run_id }}
          restore-keys: |
            mcworld-
      - name: Install Paper + plugins
        run: bash scripts/install.sh
      - name: Start Playit and Minecraft
        run: bash scripts/run.sh
      - name: Save world
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            server/world
            server/world_nether
            server/world_the_end
            server/plugins/Geyser-Spigot
            server/plugins/floodgate
            server/plugins/*/
            server/server.properties
            server/config/
            server/bukkit.yml
            server/spigot.yml
            server/paper.yml
            server/commands.yml
            server/ops.json
            server/whitelist.json
            server/banned-ips.json
            server/banned-players.json
          key: mcworld-${{ github.run_id }}
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: |
            server/logs/latest.log
            server/logs/*.log.gz
          if-no-files-found: ignore
          retention-days: 7
