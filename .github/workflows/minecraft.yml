name: Minecraft Server

# Arranque manual desde el celular/PC:
#   Repo -> Actions -> "Minecraft Server" -> Run workflow
# Tambien se puede disparar por API con un token (ver README).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version de Paper (ej: 1.21.10, 1.21.11, 26.3)"
        required: false
        default: "1.21.10"
      duration:
        description: "Minutos que el servidor queda online (max 350)"
        required: false
        default: "330"
      heap:
        description: "RAM para Java (ej: 4G, 6G, 8G)"
        required: false
        default: "8G"

concurrency:
  group: minecraft-server
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  server:
    name: Paper + Geyser + Floodgate
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      PAPER_VERSION: ${{ inputs.version }}
      DURATION: ${{ inputs.duration }}
      HEAP: ${{ inputs.heap }}
      PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ---- GeyserMC: se configura por variables de entorno ----
      # Asi funciona igual sin importar como cambie el config.yml entre versiones.
      GEYSER_BEDROCK_ADDRESS: "0.0.0.0"
      GEYSER_BEDROCK_PORT: "19132"
      # online-mode=false -> los jugadores de Bedrock entran sin cuenta Xbox
      GEYSER_JAVA_AUTH_TYPE: "offline"
      GEYSER_REMOTE_AUTH_TYPE: "offline"
      GEYSER_PASSTHROUGH_MOTD: "true"
      GEYSER_DEBUG_MODE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restaurar mundo y configs
        id: cache-world
        uses: actions/cache/restore@v4
        with:
          path: |
            server/world
            server/world_nether
            server/world_the_end
            server/plugins/Geyser-Spigot
            server/plugins/floodgate
            server/ops.json
            server/whitelist.json
            server/banned-ips.json
            server/banned-players.json
          key: mcworld-${{ github.run_id }}
          restore-keys: |
            mcworld-

      - name: Instalar Paper + Geyser + Floodgate
        run: bash scripts/install.sh

      - name: Arrancar tunel y servidor
        run: bash scripts/run.sh

      - name: Guardar mundo
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            server/world
            server/world_nether
            server/world_the_end
            server/plugins/Geyser-Spigot
            server/plugins/floodgate
            server/ops.json
            server/whitelist.json
            server/banned-ips.json
            server/banned-players.json
          key: mcworld-${{ github.run_id }}

      - name: Logs del servidor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: |
            server/logs/latest.log
            server/logs/*.log.gz
          if-no-files-found: ignore
          retention-days: 7
